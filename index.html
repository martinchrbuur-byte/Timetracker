<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Wordle</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
  <header>
    <button id="btn-help" class="icon-btn" aria-label="How to play">?</button>
    <h1>WORDLE</h1>
    <div class="hdr-right">
      <button id="btn-stats" class="icon-btn" aria-label="Statistics">&#9776;</button>
      <button id="btn-settings" class="icon-btn" aria-label="Settings">&#9881;</button>
    </div>
  </header>
  <div id="toast-area" aria-live="polite"></div>
  <main>
    <div id="board" aria-label="Game board"></div>
  </main>
  <div id="keyboard"></div>
</div>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="sheet">
    <button id="modal-close" class="icon-btn close" aria-label="Close">&times;</button>
    <div id="modal-body"></div>
  </div>
</div>

<script src="js/words.js"></script>
<script src="js/game.js"></script>
</body>
</html>
